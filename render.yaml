services:
  - type: web
    name: caci-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # Set this manually in Render dashboard (contains credentials)
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false        # Set this manually in Render dashboard
      - key: VYNFY_API_KEY
        sync: false        # Set this manually in Render dashboard
